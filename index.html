<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LexRhin</title>
<meta name="theme-color" content="#F6F5FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LexRhin">
<link rel="apple-touch-icon" sizes="180x180" href="icons/lexrhin-180.png?v=1.8">
<link rel="icon" type="image/png" href="icons/favicon.png?v=1.8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2147; --ink2:#34376A; --muted:#5B5E7A; --faint:#6E7190; --line:#E4E5F0;
  --bg:#F6F5FB; --card:#FFFFFF; --indigo:#4250C9; --indigo-text:#3442B8; --indigo-soft:#EEF0FF;
  --gold:#F5B301; --green:#1E8E5A; --green-text:#145C3A; --green-soft:#E3F5EC;
  --red:#C2410C; --red-text:#8C2F08; --red-soft:#FDECE4;
  --amber-text:#8A4B08; --amber-soft:#FFF1DC; --plum:#7A3E9D; --plum-soft:#F3E8FA;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font-family:inherit;color:inherit}
a{color:var(--indigo-text)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;padding:calc(var(--safe-top) + 14px) 18px calc(var(--safe-bottom) + 110px)}
#app.no-tabs{padding-bottom:calc(var(--safe-bottom) + 28px)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 2px 10px rgba(31,33,71,.06)}
.dark{background:var(--ink);color:#fff}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.h1{font-size:24px;font-weight:900;margin:0}
.h2{font-size:18px;font-weight:900;margin:0}
.h3{font-size:15px;font-weight:900;margin:0}
.small{font-size:12px;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:6px 11px;font-weight:800;font-size:14px;box-shadow:0 1px 3px rgba(31,33,71,.08)}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}
.tag.indigo{background:var(--indigo-soft);color:var(--indigo-text)}
.tag.amber{background:var(--amber-soft);color:var(--amber-text)}
.tag.green{background:var(--green-soft);color:var(--green-text)}
.tag.plum{background:var(--plum-soft);color:#5E2D7A}
.tag.red{background:var(--red-soft);color:var(--red-text)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:none;border-radius:16px;background:var(--indigo);color:#fff;font-weight:900;font-size:16px;cursor:pointer;text-decoration:none;padding:0 16px}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.soft{background:var(--indigo-soft);color:var(--indigo-text)}
.btn.danger{background:var(--red-soft);color:var(--red-text)}
.btn:disabled{background:var(--line);color:var(--muted);cursor:default}
.btn.sm{min-height:44px;font-size:14px;border-radius:14px}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:12px;color:var(--ink);cursor:pointer;flex:none}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>div{height:100%;border-radius:999px;background:var(--indigo)}
.bubble{background:var(--indigo-soft);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:14px;line-height:1.35;font-weight:600}
.mission{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:10px 12px;width:100%;border:none;text-align:left;cursor:pointer;min-height:64px}
.mission.active{box-shadow:0 0 0 2px var(--indigo)}
.mission.darkm{background:var(--ink);color:#fff}
.mico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.mtitle{font-weight:800;font-size:15px}
.msub{font-size:12px;font-weight:600;color:var(--muted)}
.darkm .msub{color:#D4D6F0}
.check{width:26px;height:26px;border-radius:999px;background:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.go{background:var(--indigo);color:#fff;font-weight:800;font-size:12px;padding:6px 10px;border-radius:999px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.week span{font-size:12px;font-weight:700;color:var(--muted)}
.progress-top{display:flex;align-items:center;gap:10px}
.option{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 14px;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;background:#fff;border:2px solid var(--line);text-align:left;color:var(--ink)}
.option .letter{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;background:#F1F2F8;color:var(--muted);flex:none}
.option.ok{background:var(--green-soft);border-color:var(--green)}
.option.ok .letter{background:var(--green);color:#fff}
.option.ko{background:var(--red-soft);border-color:var(--red)}
.option.ko .letter{background:var(--red);color:#fff}
.option[disabled]{cursor:default}
.feedback{padding:14px 16px;border-radius:16px;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--green-soft);color:var(--green-text)}
.feedback.ko{background:var(--red-soft);color:var(--red-text)}
.feedback b{font-weight:900;font-size:15px}
.feedback span{font-size:13px;line-height:1.45;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
textarea,input[type=text],input[type=search]{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.5;background:#fff;outline:none}
textarea:focus,input:focus{border-color:var(--indigo)}
textarea{resize:vertical;min-height:120px}
.write{min-height:260px;border-color:var(--indigo)}
.prewrap{white-space:pre-wrap;font-size:14px;line-height:1.55;font-weight:600}
.source{font-size:16px;line-height:1.55;font-weight:700}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--safe-bottom);z-index:5}
.tabbar nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:64px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer}
.tab.on{color:var(--indigo-text);font-weight:900}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal .d{height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
.cal .d small{font-size:9px;font-weight:800;line-height:1}
.cal .future{color:var(--faint)}
.wordrow{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.wordrow:last-child{border-bottom:none}
.dots{display:flex;gap:3px;margin-top:6px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line);display:block}
.dots i.on{background:var(--green)}
.stat{border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;background:#fff}
.stat b{font-size:20px;font-weight:900}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.celebrate{background:var(--ink);color:#fff;border-radius:28px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.timer{display:flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:800}
details summary{cursor:pointer;font-weight:800;color:var(--indigo-text);list-style:none;padding:10px 0}
details summary::-webkit-details-marker{display:none}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--line);border-radius:14px;padding:4px}
.seg button{height:40px;border:none;border-radius:10px;font-size:13px;font-weight:700;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(31,33,71,.12)}
.empty{text-align:center;padding:24px 10px;color:var(--muted);font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="tabbar"></div>
<div id="toast"></div>
<script src="data.js?v=1.8"></script>
<script src="app.js?v=1.8"></script>
</body>
</html>
